<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GuardEye – Digital Safety</title><meta name="theme-color" content="#14213D"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<style>
:root{--navy:#14213D;--soft:#EAF2FF;--blue:#2563EB;--teal:#0F9D83;--amber:#B45309;--amberbg:#FEF3C7;--red:#DC2626;--redbg:#FEE2E2;--grey:#F5F7FA;--line:#D9E1EE}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;border:0;border-radius:0;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none}
nav button[aria-current=page]{color:var(--blue);box-shadow:inset 0 3px var(--blue)}

header b{font-size:20px;flex:1}.pill{font-size:14px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.15)}.pill.on{background:var(--teal)}
main{padding:16px 16px 100px;max-width:1000px;margin:auto}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 2px 10px rgba(20,33,61,.08);margin-bottom:16px}
.grid{display:grid;gap:16px}@media(min-width:800px){.grid{grid-template-columns:1fr 1fr}nav{top:0;bottom:auto;right:auto;width:150px;flex-direction:column;padding-top:70px;height:100vh}nav button{flex:0;min-height:64px;font-size:16px}header,main{margin-left:150px}header{margin-left:150px}main{margin-left:calc(150px + (100vw - 150px - 1000px)/2 );}}
@media(min-width:800px) and (max-width:1200px){main{margin-left:150px}}
.hero{text-align:center}.hero svg{width:120px;height:120px}.eye-ring{display:inline-block;border-radius:50%;padding:20px;background:var(--grey)}.on .eye-ring{background:#D5F3EC;animation:pulse 2.4s infinite}

.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:14px;font-weight:700}.high{background:var(--redbg);color:#991B1B}.medium{background:var(--amberbg);color:var(--amber)}.low{background:#D5F3EC;color:#0B6B58}.unknown{background:var(--grey);color:#475569}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}input,select,textarea{min-height:48px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;width:100%;font:inherit}textarea{min-height:120px}

#warn{position:fixed;top:64px;left:50%;transform:translateX(-50%);width:min(560px,94vw);z-index:30;background:#fff;border:3px solid var(--amber);border-left-width:10px;border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:in .25s}
#warn.high{border-color:var(--red)}@keyframes in{from{opacity:0;transform:translate(-50%,-12px)}}

.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<header><span id="hEye"></span><b>GuardEye</b><span class="pill" id="hPill"></span></header>
<div id="warn" role="alertdialog" aria-live="assertive" hidden></div>
<main id="app"></main>
<nav aria-label="Main"><button data-v="home">🏠<span>Home</span></button><button data-v="feed">📱<span>Feed</span></button><button data-v="scan">🔍<span>Scan</span></button><button data-v="history">📋<span>History</span></button><button data-v="settings">⚙️<span>Settings</span></button></nav>
<dialog id="dlg"></dialog>
<script>
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sess=LS('ge_s',null),hist=LS('ge_h',[]),set=LS('ge_c',{notify:true}),view='home',seen=new Set(),F={q:'',t:'all',r:'all',o:'new'},tick,busy=false,flagId=null;
const RISK={'Potentially Safe':'low','Unable to Determine':'unknown','Suspicious':'medium','Potentially Manipulated':'medium','Potentially AI-Generated':'high','Possible Scam':'high'};
const LIMIT='This is an assistance tool, not proof. A score is an estimate of risk, not accuracy, and "no warning" does not mean content is genuine.';
const eye=(on,s=28)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true">${on?'<path d="M4 32C14 16 50 16 60 32 50 48 14 48 4 32Z"/><circle cx="32" cy="32" r="9" fill="currentColor"/>':'<path d="M4 30C14 44 50 44 60 30"/><path d="M14 40l-6 8M32 44v9M50 40l6 8"/>'}</svg>`;
/* ---------- REAL ANALYSIS ---------- */
const RULES=[[/guarantee[d]?|risk[- ]free|assured returns?|\b\d+\s?x returns?|double your money/i,30,'Promises guaranteed or unusually high returns'],[/act now|limited (slots|time|seats)|hurry|last chance|expires (today|soon)|urgent/i,15,'Uses urgency to pressure you'],[/\botp\b|password|pin\b|cvv|card number|aadhaar|bank details/i,35,'Asks for private codes or financial details'],[/https?:\/\/\S+|\b(bit\.ly|tinyurl|t\.co|wa\.me)\S*/i,10,'Contains a link – check where it really goes'],[/\.(xyz|top|click|tk|ru)\b/i,15,'Link uses a domain often seen in scams'],[/invest|crypto|bitcoin|trading|forex|lottery|prize|you (have )?won/i,15,'Mentions investment, crypto or prizes'],[/(prime minister|minister|celebrity|elon|ceo).{0,40}(endors|recommend|launch|scheme)|government[- ]backed/i,20,'Claims a public figure or government endorses it'],[/forward (this )?to|share (this )?with (all|everyone)|send to \d+/i,15,'Pushes you to forward it widely'],[/\b(shocking|secret|they don'?t want you to know|leaked|exposed)\b/i,10,'Uses sensational language']];
function analyzeText(t,type='Text'){t=String(t||'').slice(0,5000);const hit=RULES.filter(r=>r[0].test(t)),sc=Math.min(100,hit.reduce((a,r)=>a+r[1],0));
const cat=!t.trim()?'Unable to Determine':sc>=50?'Possible Scam':sc>=25?'Suspicious':'Potentially Safe';
return{type,activity:cat==='Possible Scam'?'Possible Scam':cat==='Suspicious'?'Suspicious Text':'Text check',category:cat,score:sc,reasons:hit.length?hit.map(r=>r[2]):[cat==='Unable to Determine'?'No text to check':'No common scam or pressure wording found'],action:cat==='Possible Scam'||cat==='Suspicious'?'Do not click links or share codes. Verify with the official source or someone you trust.':'Still check the source before sharing. This only checks wording, not facts.',method:'Rule-based wording check (does not verify facts)'}}
const MARK=/stable diffusion|midjourney|dall[-· ]?e|adobe firefly|leonardo\.?ai|comfyui|automatic1111|trainedAlgorithmicMedia|c2pa|jumbf|synthid|elevenlabs|runway|sora|openai|made with ai|ai generated|ai-generated/i;
async function analyzeFile(f){const kind=f.type.startsWith('image/')?'Image':f.type.startsWith('video/')?'Video':f.type.startsWith('audio/')?'Audio':null;
if(!kind)throw Error('Unsupported file type. Please choose an image, video or audio file.');if(f.size>25*1048576)throw Error('File is larger than 25 MB.');
const dec=b=>new TextDecoder('latin1').decode(new Uint8Array(b)),head=dec(await f.slice(0,393216).arrayBuffer()),tail=f.size>393216?dec(await f.slice(Math.max(0,f.size-131072)).arrayBuffer()):'',all=head+tail,m=all.match(MARK),ed=/photoshop|gimp|lightroom|canva|capcut|faceapp|facetune/i.exec(all),exif=/Exif\0\0/.test(head);
const act=kind==='Image'?'Possible Fake Image':kind==='Audio'?'Possible AI Voice':'Possible Video Manipulation';
if(m)return{type:kind,activity:act.replace('Possible','Possible AI-labelled'),category:'Potentially AI-Generated',score:85,reasons:[`The file carries an AI-tool marker in its hidden data ("${m[0]}")`],action:'Treat as AI-made unless the sender tells you the source. Verify before sharing.',method:'File metadata/provenance marker scan',file:f.name};
if(ed)return{type:kind,activity:act,category:'Potentially Manipulated',score:40,reasons:[`Hidden data shows editing software ("${ed[0]}"). Editing is often harmless.`],action:'Check the original source if the content makes a big claim.',method:'File metadata scan',file:f.name};
return{type:kind,activity:kind+' check',category:'Unable to Determine',score:0,reasons:['No AI marker found in the file\'s hidden data.',kind==='Image'&&!exif?'No camera data either – common for screenshots and social-media copies.':'Many AI files carry no marker, so this does not prove it is genuine.','Pixel/voice-level AI detection is a future feature.'],action:'Check who posted it and look for the same story from trusted news sources.',method:'File metadata scan only',file:f.name}}
/* ---------- STATE ---------- */
function add(r){r.id=Date.now()+Math.random();r.ts=Date.now();r.risk=RISK[r.category];hist.unshift(r);hist=hist.slice(0,500);SV('ge_h',hist);render();if((r.risk==='high'||r.risk==='medium')&&set.notify)warn(r);return r}
function startP(){if(sess)return;sess={start:Date.now()};seen=new Set();SV('ge_s',sess);render()}
function stopP(){if(M.on)stopMon();sess=null;SV('ge_s',null);hideWarn();render()}
const dur=()=>{const s=sess?Math.floor((Date.now()-sess.start)/1e3):0,p=n=>String(n).padStart(2,'0');return`${p(s/3600|0)} hr ${p(s/60%60|0)} min ${p(s%60)} sec`};
const inSess=()=>sess?hist.filter(h=>h.ts>=sess.start):[];
const fmt=t=>new Date(t).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2600)}
/* ---------- WARNING ---------- */
function warn(r){flagId=r.postId||null;const w=$('#warn');w.className=r.risk;w.hidden=false;w.innerHTML=`<b>⚠️ CAUTION</b> <span class="tag ${r.risk}">${r.risk==='high'?'High':'Medium'} risk</span><p style="margin:6px 0">${r.type==='Video'?'This video':'This content'} may contain AI-generated, manipulated or deceptive material. Please verify the source before trusting or sharing it.</p><div class="row"><button onclick="detail('${r.id}')">View details</button><button onclick="detail('${r.id}',1)">Why am I seeing this?</button><button onclick="hideWarn()">Dismiss</button></div>`;document.querySelectorAll('.post').forEach(p=>p.classList.toggle('flag',p.dataset.id===flagId))}
function hideWarn(){$('#warn').hidden=true;document.querySelectorAll('.post.flag').forEach(p=>p.classList.remove('flag'))}
function detail(id,why){const r=hist.find(h=>String(h.id)===String(id));if(!r)return;const d=$('#dlg');d.innerHTML=`<h2 style="margin-top:0">${esc(r.activity)}</h2><p><span class="tag ${r.risk}">${esc(r.category)}</span></p>${why?`<p><b>Why you are seeing this:</b> GuardEye checks wording and hidden file data for common warning signs. These were found:</p>`:''}<ul>${r.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>Next step:</b> ${esc(r.action)}</p><p class="note">Type: ${esc(r.type)}${r.file?' · '+esc(r.file):''}<br>Risk score (estimate, not accuracy): ${r.score}/100<br>Method: ${esc(r.method)}<br>Time: ${fmt(r.ts)}<br>${r.demo?'⚠ Media verdict in this demo post is a labelled demonstration scenario.<br>':''}${LIMIT}</p><button onclick="this.closest('dialog').close()">Close</button>`;d.showModal()}
/* ---------- FEED ---------- */
const POSTS=[{id:'p1',u:'asha_travels',c:'#0F9D83',cap:'Sunset walk with the family today 🌅',g:['#f59e0b','#2563EB'],lbl:'Photo'},
{id:'p2',u:'nature.daily',c:'#2563EB',cap:'Look at this rare creature found in the Himalayas!',g:['#7c3aed','#0f9d83'],lbl:'Image',sc:{type:'Image',activity:'Possible Fake Image',category:'Potentially AI-Generated',score:92,reasons:['DEMO SCENARIO: stands in for a detector flagging odd textures and impossible details']}},
{id:'p3',u:'news_flash_24',c:'#DC2626',cap:'Leader announces shocking new decision – watch now',g:['#14213D','#DC2626'],lbl:'Video ▶',sc:{type:'Video',activity:'Possible Video Manipulation',category:'Potentially Manipulated',score:88,reasons:['DEMO SCENARIO: stands in for a detector finding face and lip-sync mismatches']}},
{id:'p4',u:'quick_money_hub',c:'#F59E0B',cap:'🚨 Government-backed scheme! Invest ₹5,000 today, guaranteed 10x returns in 7 days. Limited slots, act now: bit.ly/earn-fast. Share your OTP to claim.',g:['#0f9d83','#14213D'],lbl:'Image'},
{id:'p5',u:'voice_note_viral',c:'#7c3aed',cap:'Audio message from a famous celebrity – listen!',g:['#2563EB','#14213D'],lbl:'Audio 🔊',sc:{type:'Audio',activity:'Possible AI Voice',category:'Potentially AI-Generated',score:90,reasons:['DEMO SCENARIO: stands in for a detector finding synthetic-voice patterns']}}];
function scanPost(p){const t=analyzeText(p.cap,p.sc?p.sc.type:'Post');let r=t;if(false&&p.sc&&p.sc.score>=t.score)r={...p.sc,action:'Check who posted it and look for trusted news coverage before sharing.',method:'Demo scenario (media) + wording check',demo:1};r={...r,postId:p.id};if(r.category==='Potentially Safe'&&!p.sc)r.activity='Post check';return add(r)}
function feedView(){return`<div class="card" style="display:flex;gap:12px;align-items:center">${eye(!!sess,40)}<div><b>${sess?'Protection is active':'Protection is paused'}</b><div class="note">${sess?'Posts are checked as you scroll.':'Start protection on Home to check posts automatically.'}</div></div></div>`+POSTS.map(p=>`<article class="card post" data-id="${p.id}"><div class="who"><span class="av" style="background:${p.c}"></span>${p.u}</div><div class="media" style="background:linear-gradient(135deg,${p.g[0]},${p.g[1]})">${p.lbl}<small>Test content</small></div><p>${esc(p.cap)}</p><div class="acts"><button aria-label="Like">♡ Like</button><button aria-label="Comment">💬 Comment</button><button aria-label="Share">↗ Share</button><button onclick="manual('${p.id}')">🔍 Scan</button></div></article>`).join('')}
function manual(id){if(!sess){toast('Start Protection first');return}seen.add(id);scanPost(POSTS.find(p=>p.id===id))}
let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{const id=e.target.dataset.id;if(e.isIntersecting&&sess&&!seen.has(id)){seen.add(id);scanPost(POSTS.find(p=>p.id===id))}}),{threshold:.7});document.querySelectorAll('.post').forEach(p=>io.observe(p))}
/* ---------- VIEWS ---------- */
const row=(h,i,n)=>`<tr tabindex="0" onclick="detail('${h.id}')" onkeydown="if(event.key==='Enter')detail('${h.id}')"><td>${n}</td><td>${esc(h.activity)}<br><span class="tag ${h.risk}">${esc(h.category)}</span></td><td>${h.score}</td><td>${fmt(h.ts)}</td></tr>`;
const tbl=(a)=>a.length?`<div class="wrap"><table><thead><tr><th>S.No.</th><th>Activity</th><th>Est. score</th><th>Time</th></tr></thead><tbody>${a.map((h,i)=>row(h,i,i+1)).join('')}</tbody></table></div>`:'<p class="note">Nothing here yet. Start protection and open the Feed, or scan something.</p>';
function homeView(){const s=inSess();return`<div class="grid"><section class="card hero ${sess?'on':''}"><div class="eye-ring">${eye(!!sess,80)}</div><h1 style="margin:8px 0">${sess?'Protection is active':'Protection is paused'}</h1><p class="note">${sess?'Running in app – checking supported content':'Press Start to begin checking content'}</p><button class="big ${sess?'stop':''}" onclick="${sess?'stopP()':'startP()'}">${sess?'Stop Protection':'Start Protection'}</button><p>Protection Activated: <span class="timer" id="tm">${dur()}</span></p><div class="stats"><div><b>${s.length}</b>Scanned</div><div><b>${s.filter(x=>x.risk==='high'||x.risk==='medium').length}</b>Warnings</div></div></section>${monCard()}<section class="card"><h2 style="margin-top:0">Recent activity</h2>${tbl(hist.slice(0,4))}<div class="row" style="margin-top:12px"><button onclick="go('history')">Open full history</button><button onclick="go('feed')">Open demo feed</button></div></section></div>`}
function scanView(){return`<div class="grid"><section class="card"><h2 style="margin-top:0">Check a file</h2><p class="note">Images, video or audio up to 25 MB. Files are read on your device and are <b>not uploaded or saved</b>.</p><input type="file" id="fi" accept="image/*,video/*,audio/*" aria-label="Choose file"><div id="fst" style="margin-top:10px"></div></section><section class="card"><h2 style="margin-top:0">Check a message</h2><textarea id="ti" maxlength="5000" placeholder="Paste a message or post text"></textarea><button class="big" style="margin-top:10px" onclick="doText()">Check message</button></section></div><section class="card note">What really runs: scam-wording rules for text, and a hidden-data (metadata) check for files. Pixel-level image, video and voice AI detection is not built yet.</section>`}
async function doText(){const v=$('#ti').value.trim();if(!v){toast('Paste some text first');return}const r=add(analyzeText(v,'Text'));if(r.risk==='low')detail(r.id)}
async function doFile(f){const st=$('#fst');st.innerHTML='<span class="spin"></span> Checking…';try{const r=add(await analyzeFile(f));st.innerHTML='';detail(r.id)}catch(e){st.innerHTML=`<span class="tag high">${esc(e.message)}</span>`}}
function histView(){let a=hist.filter(h=>(F.t==='all'||h.type===F.t)&&(F.r==='all'||h.risk===F.r)&&(!F.q||(h.activity+h.category+h.reasons.join()).toLowerCase().includes(F.q.toLowerCase())));a=F.o==='old'?[...a].reverse():a;
return`<section class="card"><h2 style="margin-top:0">Scan history</h2><div class="row"><input id="hq" type="search" placeholder="Search" value="${esc(F.q)}" aria-label="Search history"><select id="ht" aria-label="Type">${['all','Image','Video','Audio','Text','Post','Screen'].map(x=>`<option ${F.t===x?'selected':''} value="${x}">${x==='all'?'All types':x}</option>`).join('')}</select><select id="hr" aria-label="Risk">${['all','high','medium','low','unknown'].map(x=>`<option ${F.r===x?'selected':''} value="${x}">${x==='all'?'All risk levels':x+' risk'}</option>`).join('')}</select><select id="ho" aria-label="Sort"><option value="new" ${F.o==='new'?'selected':''}>Newest first</option><option value="old" ${F.o==='old'?'selected':''}>Oldest first</option></select></div><div id="ht2" style="margin-top:12px">${tbl(a)}</div><button style="margin-top:12px" onclick="clearH()">Clear history</button></section>`}
function clearH(){if(confirm('Delete all scan history? This cannot be undone.')){hist=[];SV('ge_h',hist);render()}}
function setView(){return`<section class="card"><h2 style="margin-top:0">Settings</h2><label style="display:flex;gap:12px;align-items:center"><input type="checkbox" style="width:28px;min-height:28px" ${set.notify?'checked':''} onchange="set.notify=this.checked;SV('ge_c',set)"> Show warning popups</label><div class="row" style="margin-top:14px"><button onclick="clearH()">Clear scan history</button><button id="inst" hidden>Install app</button></div></section><section class="card"><h3 style="margin-top:0">Privacy</h3><p>Everything runs on your device. Files are not uploaded or stored; only the result (type, category, reason, time) is saved in this browser. No account, no tracking.</p><h3>Limits</h3><p>${LIMIT} A web app cannot watch other apps like WhatsApp or Instagram; that needs a future Android app or browser extension with your permission. Image, video and audio checks currently read hidden file data only. Media verdicts on the demo feed are labelled demonstration scenarios.</p><h3>About</h3><p class="note">GuardEye prototype for YIIC 9. Version 0.1.</p></section>`}
/* ---------- REAL SCREEN MONITOR (PC browser: Chrome/Edge) ---------- */
const M={on:false,stream:null,timer:null,worker:null,v:null,prev:null,busy:false,scanned:0,skipped:0,last:null,status:'Off',every:5,lastKey:'',lastKeyT:0};
const hashFrame=c=>{const t=document.createElement('canvas');t.width=t.height=32;const x=t.getContext('2d');x.drawImage(c,0,0,32,32);const d=x.getImageData(0,0,32,32).data,o=[];for(let i=0;i<d.length;i+=4)o.push((d[i]+d[i+1]+d[i+2])/3);return o};
const frameDiff=(a,b)=>!a||!b?99:a.reduce((s,v,i)=>s+Math.abs(v-b[i]),0)/a.length;
const loadT=()=>new Promise((ok,no)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>no(Error('Could not load the text reader (needs internet the first time).'));document.head.append(s)});
function updMon(){const e=$('#mst');if(e)e.textContent=`${M.status} · Last scan: ${M.last?new Date(M.last).toLocaleTimeString():'none yet'} · Screens read: ${M.scanned} · Unchanged skipped: ${M.skipped}`}
async function startMon(){if(M.on)return;if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){toast('Screen capture is not available in this browser. Use Chrome or Edge on a PC.');return}
try{M.stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:2},audio:false})}catch{toast('Screen sharing was not allowed');return}
M.status='Loading text reader…';updMon();
try{await loadT();M.worker=await Tesseract.createWorker('eng')}catch(e){M.stream.getTracks().forEach(t=>t.stop());M.status='Off';toast(e.message);updMon();return}
const v=document.createElement('video');v.srcObject=M.stream;v.muted=true;await v.play();M.v=v;M.prev=null;M.scanned=M.skipped=0;M.on=true;M.status='Monitoring';M.stream.getVideoTracks()[0].onended=stopMon;startP();M.timer=setInterval(monTick,M.every*1000);render();monTick()}
async function monTick(){if(M.busy||!M.on||!M.v||!M.v.videoWidth)return;M.busy=true;
try{const v=M.v,s=Math.min(1,1280/v.videoWidth),c=document.createElement('canvas');c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const h=hashFrame(c);M.last=Date.now();
if(frameDiff(M.prev,h)<1){M.skipped++;return}M.prev=h;M.status='Reading screen…';updMon();
const {data}=await M.worker.recognize(c);M.scanned++;M.status='Monitoring';const r=analyzeText(data.text,'Screen');
if(r.score>=25){const k=r.reasons.join('|');if(k!==M.lastKey||Date.now()-M.lastKeyT>60000){M.lastKey=k;M.lastKeyT=Date.now();r.activity=r.category==='Possible Scam'?'Possible Scam on screen':'Suspicious text on screen';r.method='Screen capture + OCR (Tesseract.js, on device) + rule-based wording check';add(r)}}}
catch(e){M.status='Error – will retry'}finally{M.busy=false;updMon()}}
function stopMon(){clearInterval(M.timer);if(M.stream)M.stream.getTracks().forEach(t=>t.stop());if(M.worker){M.worker.terminate();M.worker=null}M.on=false;M.v=null;M.stream=null;M.status='Off';render()}
const monCard=()=>`<section class="card"><h2 style="margin-top:0">Screen monitor <span class="tag ${M.on?'low':'unknown'}">${M.on?'Capturing screen':'Off'}</span></h2><p class="note">Reads the text on the screen, window or tab <b>you choose to share</b>, on this device, and checks it for scam wording. No screenshots are saved and screen text is not stored. Needs Chrome or Edge on a PC. Android browsers cannot do this.</p><label>Check every <select id="mi" style="width:auto" onchange="M.every=+this.value;if(M.on){clearInterval(M.timer);M.timer=setInterval(monTick,M.every*1000)}">${[3,5,10,30].map(n=>`<option ${M.every===n?'selected':''} value="${n}">${n} seconds</option>`).join('')}</select></label><button class="big ${M.on?'stop':''}" style="margin-top:10px" onclick="${M.on?'stopMon()':'startMon()'}">${M.on?'Stop screen monitor':'Start screen monitor'}</button><p class="note" id="mst"></p></section>`;
