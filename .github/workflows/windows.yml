name: Build Windows EXE
on: [push, workflow_dispatch]
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyinstaller mss pillow pytesseract plyer
      - run: pyinstaller --onefile --name GuardEyeMonitor windows/windows_monitor.py
      - uses: actions/upload-artifact@v4
        with: { name: GuardEyeMonitor-exe, path: dist/GuardEyeMonitor.exe }
